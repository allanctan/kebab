description: >
  Educational content: textbooks, curriculum modules, learning materials,
  lesson plans, school subjects including science, earth science, physics,
  biology, chemistry, mathematics, english, social studies, history,
  geography. Any K-12 or college academic material.

generate_instruction: >
  Write with pedagogical clarity. Structure the article as: introduction
  defining the topic scope, then core content organized by concept, then
  a brief summary of key points. Define technical terms on first use.
  Use precise academic language — do not simplify for a specific grade level.

