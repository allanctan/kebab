classification_fields:
  grade:
    type: int
    range: [1, 12]
    description: Recommended K-12 grade level
  subject:
    type: str
    description: Academic subject (e.g. science, mathematics)
  language:
    type: str
    default: en
    description: ISO 639-1 language code
  learning_objectives:
    type: list
    description: What the student should be able to do after studying this article
  bloom_level:
    type: enum
    values: [remember, understand, apply, analyze, evaluate, create]
    default: understand
    description: Highest Bloom's revised taxonomy level
  dok_level:
    type: enum
    values: [1, 2, 3, 4]
    default: 2
    description: Webb's Depth of Knowledge
  concept_tags:
    type: list
    description: Key technical terms and domain vocabulary introduced in the article
